ansible_overrides:
  essensys_version: V.1.3.0
  control_plane_version: V.1.3.7
  backend_version: V.1.3.0
  frontend_version: V.1.3.0
  cloud_backend_version: "9525a01"
  portal_frontend_version: "974298a"
  cloud_backend_consolidated: true
  cloud_backend_legacy_mode: false

highlights:
  - Scénarios domotique V.1.4.0 (UI + sync cloud 591-919)
  - Sync cloud scheduler V.1.3.1 (profils 3 h)
  - LAN IAM preview (lan_users, login local)
  - Inventaire machines stable (machines.id OVH)
  - Fix MAC armoires UNKNOWN legacyiot OVH (9525a01)
  - Portail consolidé essensys-cloud-backend :8080
  - OpenSpec audit-trail 2026-07-034 spécifié — non implémenté

excluded_from_runtime:
  - essensys-audit-service
  - immudb
  - armoire_audit_events

rollback:
  cm5_gateway: ansible-playbook -i inventory.gateway install.gateway.yml -e essensys_version=V.1.3.0
  ovh: ansible-playbook -i inventory deploy-portal-stack.yml -e cloud_backend_version=9525a01 -e portal_frontend_version=974298a
  raspberry: ansible-playbook -i inventory install.raspberrypi.yml -e essensys_version=V.1.3.0
