# Essensys V.1.5.0 — baseline figée avant DEV 1 audit-trail (OpenSpec 2026-07-034)
# Date: 2026-07-03
# Usage Ansible: ansible-playbook ... -e @/path/to/V.1.5.0-manifest.yaml

release_id: V.1.5.0
release_date: "2026-07-03"
codename: baseline-pre-audit-trail
status: frozen
next_epic: essensys-armoire-audit-trail-2026-07-034

description: >
  Ligne de base produit avant implémentation immudb / audit-trail.
  Couvre les trois périmètres Deployment Perimeters : gateway CM5 LAN,
  hub OVH, Raspberry Pi classique mono-NIC.

perimeters:
  cm5_gateway:
    label: Gateway CM5/CM6 — mon.essensys.local
    docker_stack_tag: V.1.3.0
    control_plane_tag: V.1.3.7
    verified_host: essensys@192.168.0.14
    deployed_backend_src_sha: f577c3c
    notes: >
      Images Docker V.1.3.0 ; binaire backend souvent monté depuis git hôte.
      Aligner sur release_sha server-backend avant nouveaux epics.

  ovh_cloud:
    label: Hub OVH — mon.essensys.fr
    cloud_backend_consolidated: true
    cloud_backend_port: 8080
    verified_host: ubuntu@test.essensys.fr
    notes: >
      essensys-cloud-backend consolidé ; legacyiot + portail + ingest gateway.

  raspberry_classic:
    label: Raspberry Pi classique — mon.essensys.local
    docker_stack_tag: V.1.3.0
    playbook: install.raspberrypi.yml
    notes: Stack mono-NIC identique V.1.3.0 ; pas de dual-NIC dnsmasq.

